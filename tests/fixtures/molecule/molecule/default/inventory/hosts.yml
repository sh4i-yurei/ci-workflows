---
all:
  children:
    molecule:
      vars:
        ansible_connection: containers.podman.podman
        ansible_podman_executable: "{{ lookup('env', 'PODMAN_EXECUTABLE') | default('podman-remote', true) }}"
        container_command: /usr/sbin/init
        container_systemd: always
      hosts:
        sample-alma9:
          container_image: docker.io/almalinux/9-init:latest
        sample-alma10:
          container_image: docker.io/almalinux/10-init:latest
