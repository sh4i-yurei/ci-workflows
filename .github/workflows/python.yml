name: Python checks
on:
  workflow_call:
    inputs:
      coverage_floor:
        required: true
        type: number
      coverage_package:
        required: true
        type: string
      install_command:
        required: true
        type: string
      caller_workflow:
        required: true
        type: string
      caller_job:
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check out pinned shared checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install shared checks
        run: python -m pip install --constraint .ci-workflows/requirements/ci-lock.txt -e '.ci-workflows[mutation]'
      - name: Install caller
        run: bash -e -o pipefail -c "$INSTALL_COMMAND"
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
      - name: Run tests with branch coverage
        run: python -m pytest --cov="$COVERAGE_PACKAGE" --cov-branch --cov-report=xml
        env:
          COVERAGE_PACKAGE: ${{ inputs.coverage_package }}
      - name: Check floor ratchet
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_FLOOR: ${{ inputs.coverage_floor }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          CALLER_JOB: ${{ inputs.caller_job }}
        run: bash .ci-workflows/scripts/workflow-glue.sh floor python coverage.xml
      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .ci-workflows/scripts/workflow-glue.sh changed python coverage.xml
      - name: Mutate changed functions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .ci-workflows/scripts/workflow-glue.sh mutate-python
